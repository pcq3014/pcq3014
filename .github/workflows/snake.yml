# Đặt file này tại: .github/workflows/snake.yml
name: Generate Snake Animation

on:
  schedule:
    # Chạy lại mỗi 12 tiếng để ảnh luôn cập nhật
    - cron: "0 */12 * * *"
  workflow_dispatch:   # cho phép bấm chạy tay trong tab Actions
  push:
    branches:
      - main           # nếu nhánh chính của bạn là "master" thì sửa lại

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate snake SVG
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/github-snake.gif?color_snake=#a855f7&color_dots=#ede9fe,#c4b5fd,#a78bfa,#8b5cf6,#6d28d9

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
